    <script>

        let chatId = null;

        document.getElementById('message').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();  // Prevent default Enter key action (like form submit)
            sendMessage(chatId);  // Call the sendMessage function
        }
        });

         document.getElementById('send-button').addEventListener('click', function(event) {
            event.preventDefault();  // Prevent default Enter key action (like form submit)
            sendMessage(chatId);  // Call the sendMessage function
        });

         // start the chat
      async function startChat() {
        const res = await fetch('/start_chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: "INIT_CHAT" })
        });
        const data = await res.json();
        appendMessage(data.reply, 'bot');
        console.log("Chat id", data.chat_id);
        return data.chat_id;
      }
      async function run() {
          const chatId = await startChat();
          console.log("Got chatId:", chatId);
          // Now do whatever you need with it
          return chatId;
      }

      chatId = run();

      async function sendMessage(chatId) {
        const ci = await chatId;
        const input = document.getElementById('message');
        const msg = input.value;
        if (!msg.trim()) return;
  
        appendMessage(msg, 'user');
        input.value = '';
  
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg ,
                                chat_id: ci // make pythonic
          })
        });
  
        const data = await res.json();
        appendMessage(data.reply, 'bot');
      }
  
      function appendMessage(msg, sender) {
        const div = document.createElement('div');
        div.className = 'message ' + sender;
        div.textContent = msg;
        document.getElementById('chat-box').appendChild(div);
        div.scrollIntoView();

      }
